version: '3.8'

services:
  postgres:
    image: postgres:14-alpine
    container_name: drug-finder-db
    environment:
      POSTGRES_USER: drugfinder
      POSTGRES_PASSWORD: drugfinder123
      POSTGRES_DB: drug_repurposing
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drugfinder -d drug_repurposing"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: drug-finder-cache
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: drug-finder-backend
    environment:
      DATABASE_URL: postgresql://drugfinder:drugfinder123@postgres:5432/drug_repurposing
      REDIS_URL: redis://redis:6379/0
      OMIM_API_KEY: ${OMIM_API_KEY:-}
      CORS_ORIGINS: '["http://localhost:3000"]'
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: drug-finder-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
